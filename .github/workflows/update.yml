name: Update news and deploy

on:
  schedule:
    - cron: "*/5 * * * *"    # ask every 5 min; GitHub throttles, so real runs are less frequent
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Fetch news
        run: python ingest.py
      - name: 7-day health review
        run: python review.py
      - name: Commit updated data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update news data"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      # After deploying: fail the run on a severe problem so GitHub emails the repo owner.
      - name: Alert on severe problems
        run: python review.py --strict
